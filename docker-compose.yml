version: '3.8'

services:
  neo4j:
    image: neo4j:5.18.0-community
    container_name: graphrag_neo4j
    ports:
      - "7474:7474" # Interface Web (Neo4j Browser)
      - "7687:7687" # Protocolo Bolt (Conexão Python via driver)
    environment:
      # Credenciais de autenticação
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password123}
      
      # Instalação automática e permissões do plugin APOC
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      
      # Gestão de memória otimizada para desenvolvimento
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
  neo4j_logs: